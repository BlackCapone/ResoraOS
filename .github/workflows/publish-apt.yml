name: publish-apt
# Публикует репозиторий обновлений Resora на GitHub Pages. Установленные системы получат новую версию через apt.
# Нужны: секрет APT_GPG_PRIVATE_KEY (экспорт закрытого ключа), необязательно APT_GPG_PASSPHRASE;
# Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["payload/**", "ui/**", "packaging/**"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  apt:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Тесты моста
        run: python3 -m unittest discover -s tests -v
      - name: Сборка пакета и репозитория
        env:
          GPG_PRIVATE: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
          echo "$GPG_PRIVATE" | gpg --batch --import
          export GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          bash packaging/build-deb.sh
          bash packaging/make-apt-repo.sh
          mkdir site && cp -r repo site/apt && cp repo/resora.gpg site/resora.gpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
