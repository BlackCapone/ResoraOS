<div class="control-popover" id="controlPopover" role="dialog" aria-label="Пункт управления">
    <div class="cc3-grid">
      <button class="cc2-tile cc3-m" data-on-text="Atlantus" data-off-text="Выкл." onclick="toggleCC3(this)"><span class="cc2-circle on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 8.8a14.5 14.5 0 0 1 19 0M5.8 12.3a9.5 9.5 0 0 1 12.4 0M9.2 15.8a4.4 4.4 0 0 1 5.6 0"/><circle cx="12" cy="19.2" r="1.2" fill="currentColor" stroke="none"/></svg></span><span class="cc2-txt"><b>Wi-Fi</b><small>Atlantus</small></span></button>
      <button class="cc2-tile cc3-m" data-on-text="Вкл." data-off-text="Выкл." onclick="toggleCC3(this)"><span class="cc2-circle on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7.5 10 9-5 4.500V3l5 4.500-10 9"/></svg></span><span class="cc2-txt"><b>Bluetooth</b><small>Вкл.</small></span></button>
      <button class="cc2-tile cc3-m" data-on-text="Только контакты" data-off-text="Выкл." onclick="toggleCC3(this)"><span class="cc2-circle on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M7.700 7.700a6 6 0 0 0 0 8.600M16.300 7.700a6 6 0 0 1 0 8.600M4.800 4.800a10 10 0 0 0 0 14.400M19.200 4.800a10 10 0 0 1 0 14.400"/></svg></span><span class="cc2-txt"><b>AirDrop</b><small>Только контакты</small></span></button>
      <button class="cc2-tile cc3-m" data-on-text="Не беспокоить" data-off-text="Выкл." onclick="toggleCC3(this)"><span class="cc2-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8.500 8.500 0 0 1 9.500 4a8.500 8.500 0 1 0 10.500 10.500Z"/></svg></span><span class="cc2-txt"><b>Фокус</b><small>Выкл.</small></span></button>
      <div class="cc2-tile cc3-w cc2-slider"><b>Дисплей</b><div class="cc2-track" style="--p:.75"><span class="cc2-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2.500M12 19v2.500M2.500 12H5M19 12h2.500M5.300 5.300l1.800 1.800M16.900 16.900l1.800 1.800M5.300 18.700l1.800-1.800M16.900 7.100l1.800-1.800"/></svg></span><input class="cc2-range" type="range" min="0" max="100" value="75" aria-label="Яркость дисплея" oninput="this.parentNode.style.setProperty('--p',this.value/100)"></div></div>
      <div class="cc2-tile cc3-w cc2-slider"><b>Звук</b><div class="cc2-track" style="--p:.6"><span class="cc2-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.500h3.500L12 5.500v13l-4.500-4H4Z" fill="currentColor"/><path d="M15.500 9a4.500 4.500 0 0 1 0 6M18 6.500a8 8 0 0 1 0 11"/></svg></span><input class="cc2-range" type="range" min="0" max="100" value="60" aria-label="Громкость" oninput="this.parentNode.style.setProperty('--p',this.value/100)"></div></div>
      <div class="cc2-tile cc3-w cc2-now">
        <span class="cc2-art"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="ccArt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7a93"/><stop offset="1" stop-color="#f81f3d"/></linearGradient></defs><rect width="48" height="48" rx="10" fill="url(#ccArt)"/><g fill="#fff"><ellipse cx="18" cy="32" rx="4.600" ry="3.600" transform="rotate(-18 18 32)"/><ellipse cx="31" cy="29" rx="4.600" ry="3.600" transform="rotate(-18 31 29)"/><rect x="20.600" y="14" width="2.400" height="18"/><rect x="33.600" y="11" width="2.400" height="18"/><path d="M20.600 14.500 36 10.500V15.500L20.600 19.500Z"/></g></svg></span>
        <span class="cc2-now-txt"><b>Музыка</b><small>Не воспроизводится</small></span>
        <span class="cc2-ctl"><button aria-label="Назад" onclick="toast('Плеер пока не подключён')"><svg viewBox="0 0 24 24"><path d="M19 5v14L9 12ZM6 5v14" fill="currentColor"/></svg></button><button aria-label="Пуск" onclick="toast('Плеер пока не подключён')"><svg viewBox="0 0 24 24"><path d="M7 4.500v15l12-7.500Z" fill="currentColor"/></svg></button><button aria-label="Вперёд" onclick="toast('Плеер пока не подключён')"><svg viewBox="0 0 24 24"><path d="M5 5v14l10-7ZM18 5v14" fill="currentColor"/></svg></button></span>
      </div>
      <button class="cc2-tile cc3-s cc3-dark" title="Тёмное оформление" onclick="saCCDark(this)"><span class="cc2-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.500"/><path d="M12 3.500a8.500 8.500 0 0 0 0 17Z" fill="currentColor"/></svg></span></button>
      <button class="cc2-tile cc3-s" title="Яркость клавиатуры" onclick="toggleCC3(this)"><span class="cc2-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.500" y="7" width="19" height="10" rx="2.500"/><path d="M6.500 12h.01M10 12h.01M14 12h.01M17.500 12h.01M8 14.500h8"/></svg></span></button>
      <button class="cc2-tile cc3-s" title="Повтор экрана" onclick="toggleCC3(this)"><span class="cc2-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.500" y="4" width="19" height="12" rx="2.500"/><path d="M8 20h8M12 16v4"/></svg></span></button>
      <button class="cc2-tile cc3-s" title="Stage Manager" onclick="toggleCC3(this)"><span class="cc2-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="12" height="14" rx="2.500"/><path d="M18 8v8M21 10v4"/></svg></span></button>
    </div>
    <button class="cc2-foot" onclick="toast('Редактирование Пункта управления пока недоступно')">Изменить элементы…</button>
  </div>
